---
- name: "{{ ansible_facts['distribution'] }} | [COPR] Enable Yalter/Niri"
  community.general.copr:
    host: copr.fedorainfracloud.org
    state: enabled
    name: yalter/niri
  become: true
  
# For hyprpaper
- name: "{{ ansible_facts['distribution'] }} | [COPR] Enable Solopasha/Hyprland"
  community.general.copr:
    host: copr.fedorainfracloud.org
    state: enabled
    name: solopasha/hyprland
  become: true

- name: "{{ ansible_facts['distribution'] }} | Install Niri"
  ansible.builtin.dnf5:
    name:
      - niri
      - xwayland-satellite
      - hyprpaper
      - swappy 
      - grim
      - slurp
    state: present
  become: true

- name: "{{ ansible_facts['distribution'] }} | Add Terra repository"
  ansible.builtin.yum_repository:
    name: terra
    description: Terra Repository
    baseurl: https://repos.fyralabs.com/terra$releasever
    enabled: true
    gpgcheck: false
  become: true

- name: "{{ ansible_facts['distribution'] }} | Install Terra release package"
  ansible.builtin.dnf5:
    name:
      - terra-release
      - noctalia-shell
    state: present
  become: true

