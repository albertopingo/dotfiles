---
- name: "{{ ansible_facts['distribution'] }} | Install Virt"
  community.general.pacman:
    name:
      - qemu-full
      # Libvirt
      - libvirt
      - dnsmasq
      # GUI
      - virt-manager
      - dmidecode
    state: present
  become: true

- name: "{{ ansible_facts['distribution'] }} | Add user to libvirt group"
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: libvirt
    append: true
  become: true

