- name: "{{ ansible_facts['distribution'] }} | Enable and start libvirtd and virtlogd services"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - libvirtd.service
    - virtlogd.service
  become: true

- name: "{{ ansible_facts['distribution'] }} | Configure libvirt default network"
  community.libvirt.virt_net:
    name: default
    state: active
    autostart: true
  become: true
